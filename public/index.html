<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barber Frki - Zakaži termin</title><link rel="stylesheet" href="/style.css"><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#111111"><link rel="apple-touch-icon" href="/icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Barber"></head><body><div class="wrap">
<img class="logo" src="/logo.png" alt="Barber Frki - Barber Shop">
<div class="banner"><b>Zakaži svoj termin</b><span>Plaćanje gotovinom u radnji <span id="len"></span></span></div>
<div id="main">
<h2>1 · Frizer</h2><div class="row" id="barbers"></div>
<h2>2 · Datum</h2><div class="row" id="dates"></div>
<h2>3 · Vrijeme</h2><div class="row" id="slots"><span class="empty">Prvo izaberite frizera i datum.</span></div>
<h2>4 · Vaši podaci</h2>
<div class="card"><input id="name" placeholder="Ime i prezime" autocomplete="name"><input id="phone" placeholder="Broj telefona" type="tel" autocomplete="tel">
<div class="err" id="err"></div><button class="main" id="go">Potvrdi termin</button></div>
</div>
<div id="done" class="card" hidden><h2 style="margin-top:0">Termin je zakazan ✔</h2><p id="sum"></p><button class="link" onclick="location.reload()">Zakaži novi termin</button></div>
<p class="tag">Klasika u pokretu. Stil zauvek.</p><div class="foot"><a href="tel:+38761149233"><small>Pozovi nas</small>061/149-233</a><a href="https://maps.google.com/?q=Vojvode+Mi%C5%A1i%C4%87a+112+Obrenovac" target="_blank" rel="noopener"><small>Adresa</small>Vojvode Mišića 112, Obrenovac</a><a href="https://instagram.com/barberfrki" target="_blank" rel="noopener"><small>Prati nas</small>@barberfrki</a></div><p class="sub" style="margin-top:20px"><a href="/admin" style="color:var(--mute)">Prijava za frizere</a></p>
</div>
<script>
const $=id=>document.getElementById(id);let cfg,sel={barber:null,date:null,time:null};
const fmtDate=d=>{const x=new Date(d+'T12:00:00Z');return ['Ned','Pon','Uto','Sri','Čet','Pet','Sub'][x.getUTCDay()]+', '+x.getUTCDate()+'. '+['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'][x.getUTCMonth()]};
const mk=(txt,cls,fn)=>{const b=document.createElement('button');b.className=cls;b.textContent=txt;b.onclick=fn;return b};
async function init(){cfg=await (await fetch('/api/barbers')).json();$('len').textContent=`· ${cfg.slotMinutes} min po šišanju`;
 cfg.barbers.forEach(b=>$('barbers').append(mk(b.name,'chip',e=>{sel.barber=b;sel.time=null;mark('barbers',e.target);loadSlots()})));
 if(cfg.barbers.length===1){$('barbers').firstChild.click()}
 for(let i=0;i<cfg.daysAhead;i++){const d=new Date(cfg.today+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+i);const s=d.toISOString().slice(0,10);
  $('dates').append(mk(fmtDate(s),'chip sm',e=>{sel.date=s;sel.time=null;mark('dates',e.target);loadSlots()}))}}
function mark(id,el){[...$(id).children].forEach(c=>c.classList.remove('on'));el.classList.add('on');check()}
async function loadSlots(){check();if(!sel.barber||!sel.date)return;
 const r=await (await fetch(`/api/slots?barber=${sel.barber.id}&date=${sel.date}`)).json();$('slots').innerHTML='';
 if(!r.slots.length){$('slots').innerHTML='<span class="empty">Nema slobodnih termina tog dana. Probajte drugi dan.</span>';return}
 r.slots.forEach(t=>$('slots').append(mk(t,'chip sm',e=>{sel.time=t;mark('slots',e.target)})))}
function check(){$('err').textContent=''}
$('go').onclick=async()=>{$('err').textContent='';
 if(!sel.barber)return $('err').textContent='Izaberite frizera.';if(!sel.date)return $('err').textContent='Izaberite datum.';if(!sel.time)return $('err').textContent='Izaberite vrijeme (termin).';if(!$('name').value.trim()||!$('phone').value.trim())return $('err').textContent='Unesite ime i broj telefona.';
 $('go').disabled=true;let r;try{r=await fetch('/api/book',{method:'POST',body:JSON.stringify({barberId:sel.barber.id,date:sel.date,time:sel.time,name:$('name').value,phone:$('phone').value})})}catch(e){$('err').textContent='Nema veze sa serverom. Pokušajte ponovo.';$('go').disabled=false;return}
 const d=await r.json();
 if(!r.ok){$('err').textContent=d.error;$('go').disabled=false;if(r.status===409){sel.time=null;loadSlots()}return}
 $('main').hidden=true;$('done').hidden=false;$('sum').textContent=`${d.booking.name}, zakazani ste kod ${d.booking.barber}: ${fmtDate(d.booking.date)} u ${d.booking.time}. Plaćanje gotovinom u radnji.`};
init();
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');</script></body></html>
